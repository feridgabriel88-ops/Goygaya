name: Flet APK Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Flet
      run: |
        pip install flet

    - name: Build APK
      run: |
        flet build apk --no-public-sign

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: goy-qaya-app
        path: build/apk/*.apk
